<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102018" />
    <meta name="description" content="Cámara trasera para elegir fruta en el súper. Todo queda en el teléfono." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fruta" />
    <title>Fruta</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icono-180.png" />
    <link rel="icon" href="%BASE_URL%icons/icono-192.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #102018;
        color: #f3e6c4;
      }
    </style>
  </head>
  <body>
    <video id="visor" playsinline autoplay muted></video>
    <canvas id="cajas" aria-hidden="true"></canvas>
    <div id="velo" class="velo"></div>
    <section class="etiqueta" aria-label="Estado de la cámara">
      <h1 class="marca">Fruta</h1>
      <p class="en-vivo">
        <span class="pip" id="pip" aria-hidden="true"></span>
        <span id="estado">Abriendo la cámara trasera…</span>
      </p>
      <p class="linea" id="pantalla"></p>
      <p class="linea" id="linea-detector" hidden>Cargando detector…</p>
      <p class="linea" id="linea-medicion" hidden></p>
      <label class="nitidez">
        Nitidez
        <select id="resolucion"></select>
      </label>
      <button id="toggle-depuracion" class="texto-boton" type="button" aria-expanded="false" aria-controls="depuracion">
        Depuración
      </button>
    </section>
    <section id="depuracion" class="depuracion" hidden aria-label="Depuración del detector">
      <p id="carga-detector">Cargando detector…</p>
      <p class="instruccion">Dejá el teléfono con esta pantalla abierta, apuntando a las bananas.</p>
      <label class="campo">
        Motor
        <select id="delegado"></select>
      </label>
      <p class="nota-motor">GPU es WebGL. Este MediaPipe no trae WebGPU.</p>
      <button id="medir" class="texto-boton" type="button">Medir 5 minutos</button>
      <p id="estado-medicion"></p>
      <dl class="hud">
        <dt>Latencia</dt>
        <dd id="hud-latencia">—</dd>
        <dt>Cuadros por segundo</dt>
        <dd id="hud-fps">—</dd>
        <dt>Bananas</dt>
        <dd id="hud-cantidad">0</dd>
        <dt>N</dt>
        <dd id="hud-n">—</dd>
        <dt>Carga del modelo</dt>
        <dd id="hud-carga">—</dd>
      </dl>
      <label class="campo">
        Cada cuántos cuadros
        <select id="cada-n"></select>
      </label>
      <label class="campo">
        Confianza mínima
        <input id="umbral" type="range" />
        <span id="umbral-valor"></span>
      </label>
      <button id="copiar" class="texto-boton" type="button" hidden>Copiar resumen</button>
      <button id="bajar" class="texto-boton" type="button" hidden>Bajar resumen</button>
      <pre id="resumen" class="resumen" hidden></pre>
    </section>
    <section id="aviso" class="aviso" hidden role="alert">
      <h2 id="aviso-titulo"></h2>
      <p id="aviso-detalle"></p>
      <ol id="aviso-pasos"></ol>
    </section>
    <button id="reanudar" class="reanudar" type="button" hidden>Reanudar cámara</button>
    <noscript>
      <p class="aviso noscript">Para usar la cámara, activá JavaScript en Safari.</p>
    </noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
